plugins { id 'net.fabricmc.fabric-loom-remap' version '1.14.10' }
group='com.dwinovo.numen.e2e'
version='1.0'
repositories { mavenCentral(); maven { url='https://maven.fabricmc.net/' } }
dependencies {
    minecraft 'com.mojang:minecraft:1.21.1'
    mappings loom.officialMojangMappings()
    modImplementation 'net.fabricmc:fabric-loader:0.18.1'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.116.7+1.21.1'
}
java { toolchain.languageVersion=JavaLanguageVersion.of(21) }
